name: Enforce release branch policy

on:
  pull_request:
    branches:
      - main

jobs:
  enforce:
    runs-on: ubuntu-latest
    steps:
      - name: Block non-release branches
        run: |
          echo "Source branch: ${{ github.head_ref }}"
          if [[ ! "${{ github.head_ref }}" =~ ^release/ ]]; then
            echo "PRs into main must come from a release/* branch."
            exit 1
          fi